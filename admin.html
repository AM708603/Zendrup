<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zamrud Admin</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='18' fill='white'%3EZ%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#f0fdfa',100:'#ccfbf1',500:'#14b8a6',600:'#0d9488',700:'#0f766e'}},fontFamily:{sans:['Inter','system-ui'],display:['Plus Jakarta Sans','Inter']}}}}</script>
  <style>body{font-family:Inter,system-ui,sans-serif}.font-display{font-family:'Plus Jakarta Sans',Inter,sans-serif}.sidebar-link.active{background:#f0fdfa;color:#0f766e;border-right:3px solid #14b8a6}.tab-panel{display:none}.tab-panel.active{display:block}</style>
</head>
<body class="bg-slate-100 text-slate-800">

<script>
(function(){
  const API = "https://zamrud.borntow2.workers.dev";
  const TOKEN_KEY = "zamrud_token_admin";
  const USER_KEY = "zamrud_user_admin";
  const REQUIRED_ROLES = ['admin'];

  function token(){ return localStorage.getItem(TOKEN_KEY) || localStorage.getItem("zamrud_token"); }
  function currentUser(){
    try {
      return JSON.parse(localStorage.getItem(USER_KEY) || localStorage.getItem("zamrud_user") || "null");
    } catch { return null; }
  }

  // If not logged in with correct role, go to unified login
  const u = currentUser();
  const tok = token();
  if (!tok || !u || !REQUIRED_ROLES.includes(u.role)) {
    // clear stale role keys
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    location.replace("login.html");
    return;
  }

  // Sync shared keys for consistency
  localStorage.setItem(TOKEN_KEY, tok);
  localStorage.setItem(USER_KEY, JSON.stringify(u));
  if (localStorage.getItem("zamrud_token") !== tok) localStorage.setItem("zamrud_token", tok);
  localStorage.setItem("zamrud_user", JSON.stringify(u));
})();
</script>

<div id="app" class="min-h-screen flex">
  <aside class="w-64 bg-white border-r border-slate-200 flex-shrink-0 hidden lg:flex flex-col sticky top-0 h-screen">
    <div class="px-5 py-5 border-b border-slate-100 flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-brand-600 text-white font-display font-extrabold flex items-center justify-center">Z</div>
      <div><div class="font-display font-extrabold">Zamrud</div><div class="text-[10px] font-bold text-red-600 uppercase">Admin</div></div>
    </div>
    <nav class="flex-1 p-3 space-y-0.5">
      <button onclick="showTab('overview')" class="sidebar-link active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600" data-tab="overview"><i class="fas fa-chart-pie w-5 text-center"></i> Overview</button>
      <button onclick="showTab('orders')" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600" data-tab="orders"><i class="fas fa-shopping-bag w-5 text-center"></i> All Orders</button>
      <button onclick="showTab('products')" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600" data-tab="products"><i class="fas fa-boxes-stacked w-5 text-center"></i> Inventory</button>
      <button onclick="showTab('payouts')" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600" data-tab="payouts"><i class="fas fa-wallet w-5 text-center"></i> Payouts</button>
    </nav>
    <div class="p-3 border-t border-slate-100">
      <div class="flex items-center gap-3 px-3 py-2">
        <div class="w-8 h-8 rounded-full bg-red-100 text-red-700 flex items-center justify-center text-xs font-bold" id="avatar">A</div>
        <div class="min-w-0 flex-1"><div class="text-sm font-semibold truncate" id="user-name">Admin</div><div class="text-[11px] text-slate-400 truncate" id="user-email"></div></div>
        <button onclick="logout()" class="text-slate-400 hover:text-red-500" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
  </aside>
  <main class="flex-1 min-w-0">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button class="lg:hidden p-2 rounded-lg hover:bg-slate-100" onclick="document.querySelector('aside').classList.toggle('hidden');document.querySelector('aside').classList.toggle('flex')"><i class="fas fa-bars"></i></button>
        <h1 class="font-display font-extrabold text-lg" id="page-title">Overview</h1>
      </div>
      <span class="text-xs text-slate-400" id="api-status">API connected</span>
    </header>
    <div class="p-4 sm:p-6">
      <div id="tab-overview" class="tab-panel active space-y-6">
        <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">
          <div class="bg-white rounded-2xl border border-slate-200 p-5"><div class="text-xs text-slate-500 uppercase mb-2">Revenue (delivered)</div><div class="font-display text-2xl font-extrabold" id="stat-revenue">—</div></div>
          <div class="bg-white rounded-2xl border border-slate-200 p-5"><div class="text-xs text-slate-500 uppercase mb-2">Total Orders</div><div class="font-display text-2xl font-extrabold" id="stat-orders">—</div></div>
          <div class="bg-white rounded-2xl border border-slate-200 p-5"><div class="text-xs text-slate-500 uppercase mb-2">Delivered</div><div class="font-display text-2xl font-extrabold" id="stat-delivered">—</div></div>
          <div class="bg-white rounded-2xl border border-slate-200 p-5"><div class="text-xs text-slate-500 uppercase mb-2">Pending</div><div class="font-display text-2xl font-extrabold text-amber-600" id="stat-pending">—</div></div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-5"><h3 class="font-semibold text-sm mb-3">Users by role</h3><div id="users-by-role" class="text-sm text-slate-600">Loading…</div></div>
      </div>
      <div id="tab-orders" class="tab-panel space-y-4">
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-slate-50 text-left text-xs text-slate-500 uppercase"><th class="px-4 py-3">Order</th><th class="px-4 py-3">Customer</th><th class="px-4 py-3">Product</th><th class="px-4 py-3">Total</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Date</th><th class="px-4 py-3">Action</th></tr></thead><tbody id="orders-body" class="divide-y divide-slate-50"></tbody></table></div></div>
      </div>
      <div id="tab-products" class="tab-panel space-y-4">
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden"><table class="w-full text-sm"><thead><tr class="bg-slate-50 text-left text-xs text-slate-500 uppercase"><th class="px-4 py-3">Product</th><th class="px-4 py-3">SKU</th><th class="px-4 py-3">Cost</th><th class="px-4 py-3">Stock</th><th class="px-4 py-3">Warehouse</th></tr></thead><tbody id="products-body" class="divide-y divide-slate-50"></tbody></table></div>
      </div>
      <div id="tab-payouts" class="tab-panel space-y-4">
        <div class="flex justify-between items-center"><p class="text-sm text-slate-500">Weekly payout batches</p><button onclick="runPayoutBatch()" class="px-4 py-2 bg-brand-600 text-white text-sm font-bold rounded-xl">Process Friday Batch</button></div>
        <div id="payout-msg" class="text-sm text-brand-700 hidden"></div>
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden"><table class="w-full text-sm"><thead><tr class="bg-slate-50 text-left text-xs text-slate-500 uppercase"><th class="px-4 py-3">ID</th><th class="px-4 py-3">User</th><th class="px-4 py-3">Amount</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Batch</th></tr></thead><tbody id="payouts-body" class="divide-y divide-slate-50"></tbody></table></div>
      </div>
    </div>
  </main>
</div>
<script>
const API="https://zamrud.borntow2.workers.dev";
const TOKEN_KEY="zamrud_token_admin";
const USER_KEY="zamrud_user_admin";
function token(){return localStorage.getItem(TOKEN_KEY)}
function currentUser(){try{return JSON.parse(localStorage.getItem(USER_KEY)||"null")}catch{return null}}
async function api(path,opts={}){const headers={"Content-Type":"application/json",...(opts.headers||{})};if(token())headers.Authorization="Bearer "+token();const res=await fetch(API+path,{...opts,headers});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||res.statusText);return data}
function statusBadge(s){const map={delivered:"bg-green-100 text-green-700",shipped:"bg-blue-100 text-blue-700",confirmed:"bg-indigo-100 text-indigo-700",pending:"bg-amber-100 text-amber-700",returned:"bg-red-100 text-red-700",packed:"bg-slate-100 text-slate-700",cancelled:"bg-slate-100 text-slate-500"};return `<span class="text-xs font-medium px-2 py-1 rounded-full ${map[s]||"bg-slate-100"}">${s}</span>`}
function showTab(id){document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));document.getElementById("tab-"+id).classList.add("active");document.querySelectorAll(".sidebar-link").forEach(l=>l.classList.toggle("active",l.dataset.tab===id));document.getElementById("page-title").textContent={overview:"Overview",orders:"All Orders",products:"Inventory",payouts:"Payouts"}[id]||id;if(id==="orders")loadOrders();if(id==="products")loadProducts();if(id==="payouts")loadPayouts()}
async function loadOverview(){const data=await api("/stats");const s=data.stats||{};document.getElementById("stat-revenue").textContent=(s.revenue!=null?Number(s.revenue).toLocaleString():0)+" AED";document.getElementById("stat-orders").textContent=s.total_orders??0;document.getElementById("stat-delivered").textContent=s.delivered??0;document.getElementById("stat-pending").textContent=s.pending??0;document.getElementById("users-by-role").innerHTML=(data.users||[]).map(u=>`<div class="flex justify-between py-1"><span>${u.role}</span><span class="font-medium">${u.count}</span></div>`).join("")||"No data"}
async function loadOrders(){const data=await api("/orders");document.getElementById("orders-body").innerHTML=(data.orders||[]).map(o=>`<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium text-brand-700">${o.order_number}</td><td class="px-4 py-3">${o.customer_name}</td><td class="px-4 py-3">${o.product_name}</td><td class="px-4 py-3">${o.sell_price_aed} AED</td><td class="px-4 py-3">${statusBadge(o.status)}</td><td class="px-4 py-3 text-slate-400">${(o.created_at||"").slice(0,10)}</td><td class="px-4 py-3">${o.status==="pending"?`<button onclick="setStatus('${o.id}','confirmed')" class="text-xs text-brand-600 font-semibold">Confirm</button>`:""}${o.status==="confirmed"?`<button onclick="setStatus('${o.id}','shipped')" class="text-xs text-brand-600 font-semibold">Ship</button>`:""}${o.status==="shipped"?`<button onclick="setStatus('${o.id}','delivered')" class="text-xs text-green-600 font-semibold">Deliver</button>`:""}</td></tr>`).join("")||`<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400">No orders</td></tr>`}
async function setStatus(id,status){try{await api("/orders/"+id,{method:"PATCH",body:JSON.stringify({status})});loadOrders();loadOverview()}catch(e){alert(e.message)}}
async function loadProducts(){const data=await api("/products");document.getElementById("products-body").innerHTML=(data.products||[]).map(p=>`<tr><td class="px-4 py-3 font-medium">${p.emoji||""} ${p.name}</td><td class="px-4 py-3 text-slate-400">${p.sku}</td><td class="px-4 py-3">${p.cost_aed} AED</td><td class="px-4 py-3 ${p.stock<50?"text-amber-600 font-semibold":""}">${p.stock}</td><td class="px-4 py-3">${p.warehouse||"—"}</td></tr>`).join("")||`<tr><td colspan="5" class="px-4 py-8 text-center text-slate-400">No products</td></tr>`}
async function loadPayouts(){const data=await api("/payouts");document.getElementById("payouts-body").innerHTML=(data.payouts||[]).map(p=>`<tr><td class="px-4 py-3 font-mono text-xs">${p.id}</td><td class="px-4 py-3 text-xs">${p.user_id}</td><td class="px-4 py-3 font-semibold">${p.amount_aed} AED</td><td class="px-4 py-3">${p.status}</td><td class="px-4 py-3 text-xs text-slate-400">${p.batch_id||"—"}</td></tr>`).join("")||`<tr><td colspan="5" class="px-4 py-8 text-center text-slate-400">No payouts yet</td></tr>`}
async function runPayoutBatch(){try{const data=await api("/payouts/batch",{method:"POST",body:"{}"});document.getElementById("payout-msg").classList.remove("hidden");document.getElementById("payout-msg").textContent=`Batch ${data.batch_id}: ${data.seller_count} sellers · ${data.total_aed} AED`;loadPayouts()}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem("zamrud_token_admin");localStorage.removeItem("zamrud_user_admin");localStorage.removeItem("zamrud_token");localStorage.removeItem("zamrud_user");location.href="login.html";}
async function enterApp(){const u=currentUser();if(!u||u.role!=="admin"){alert("Admin account required");logout();return}document.getElementById("app").classList.remove("hidden");document.getElementById("user-name").textContent=u.name||"Admin";document.getElementById("user-email").textContent=u.email||"";document.getElementById("avatar").textContent=(u.name||"A")[0].toUpperCase();try{await loadOverview()}catch(e){document.getElementById("api-status").textContent=e.message}}
localStorage.setItem(TOKEN_KEY,data.token);localStorage.setItem(USER_KEY,JSON.stringify(data.user));enterApp()}catch(err){errEl.textContent=err.message;errEl.classList.remove("hidden")}});
enterApp();
</script>
</body>
</html>
