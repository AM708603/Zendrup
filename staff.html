<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zamrud Staff</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='18' fill='white'%3EZ%3C/text%3E%3C/svg%3E"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#f0fdfa',100:'#ccfbf1',500:'#14b8a6',600:'#0d9488',700:'#0f766e'}},fontFamily:{sans:['Inter','system-ui'],display:['Plus Jakarta Sans','Inter']}}}}</script>
<style>body{font-family:Inter,system-ui,sans-serif}.font-display{font-family:'Plus Jakarta Sans',Inter,sans-serif}.sidebar-link.active{background:#f0fdfa;color:#0f766e;border-right:3px solid #14b8a6}.tab-panel{display:none}.tab-panel.active{display:block}</style>
</head>
<body class="bg-slate-100 text-slate-800">

<script>
(function() {
  var TOKEN_KEY = "zamrud_token_staff";
  var USER_KEY = "zamrud_user_staff";
  var roles = ['staff','admin'];
  function getUser() {
    try {
      return JSON.parse(localStorage.getItem(USER_KEY) || localStorage.getItem("zamrud_user") || "null");
    } catch (e) { return null; }
  }
  var token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem("zamrud_token");
  var user = getUser();
  if (!token || !user || roles.indexOf(user.role) === -1) {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    location.replace("login.html");
  } else {
    localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem(USER_KEY, JSON.stringify(user));
    localStorage.setItem("zamrud_token", token);
    localStorage.setItem("zamrud_user", JSON.stringify(user));
  }
})();
</script>


<div id="app" class="min-h-screen flex">
  <aside class="w-64 bg-white border-r flex-shrink-0 hidden lg:flex flex-col sticky top-0 h-screen">
    <div class="px-5 py-5 border-b flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl bg-brand-600 text-white font-display font-extrabold flex items-center justify-center">Z</div><div><div class="font-display font-extrabold">Zamrud</div><div class="text-[10px] font-bold text-blue-600 uppercase">Staff</div></div></div>
    <nav class="flex-1 p-3 space-y-0.5">
      <button onclick="showTab('queue')" class="sidebar-link active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600" data-tab="queue"><i class="fas fa-list-check w-5 text-center"></i> My Queue</button>
      <button onclick="showTab('orders')" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600" data-tab="orders"><i class="fas fa-shopping-bag w-5 text-center"></i> Orders</button>
      <button onclick="showTab('products')" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600" data-tab="products"><i class="fas fa-boxes-stacked w-5 text-center"></i> Inventory</button>
    </nav>
    <div class="p-3 border-t"><div class="flex items-center gap-3 px-3 py-2"><div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold" id="avatar">S</div><div class="min-w-0 flex-1"><div class="text-sm font-semibold truncate" id="user-name">Staff</div><div class="text-[11px] text-slate-400" id="user-email"></div></div><button onclick="logout()" class="text-slate-400 hover:text-red-500"><i class="fas fa-sign-out-alt"></i></button></div></div>
  </aside>
  <main class="flex-1 min-w-0">
    <header class="bg-white border-b sticky top-0 z-20 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3"><button class="lg:hidden p-2" onclick="document.querySelector('aside').classList.toggle('hidden');document.querySelector('aside').classList.toggle('flex')"><i class="fas fa-bars"></i></button><h1 class="font-display font-extrabold text-lg" id="page-title">My Queue</h1></div>
      <span class="text-xs text-green-600 font-medium">Online</span>
    </header>
    <div class="p-4 sm:p-6">
      <div id="tab-queue" class="tab-panel active space-y-4">
        <div class="grid sm:grid-cols-3 gap-4">
          <div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-500">Open tasks</div><div class="font-display text-2xl font-extrabold" id="stat-tasks">—</div></div>
          <div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-500">COD to call</div><div class="font-display text-2xl font-extrabold text-amber-600" id="stat-cod">—</div></div>
          <div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-500">Pack tasks</div><div class="font-display text-2xl font-extrabold text-blue-600" id="stat-pack">—</div></div>
        </div>
        <div class="bg-white rounded-2xl border overflow-hidden"><div class="px-5 py-3 border-b font-semibold text-sm">Tasks</div><div id="tasks-list" class="divide-y text-sm"></div></div>
      </div>
      <div id="tab-orders" class="tab-panel space-y-4">
        <div class="bg-white rounded-2xl border overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-slate-50 text-left text-xs text-slate-500 uppercase"><th class="px-4 py-3">Order</th><th class="px-4 py-3">Customer</th><th class="px-4 py-3">Phone</th><th class="px-4 py-3">Product</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Action</th></tr></thead><tbody id="orders-body" class="divide-y"></tbody></table></div></div>
      </div>

      <div id="tab-products" class="tab-panel space-y-4">
        <div class="flex justify-between items-center">
          <p class="text-sm text-slate-500">Update stock and product details</p>
          <button onclick="document.getElementById('staff-product-form').classList.toggle('hidden')" class="px-4 py-2 bg-brand-600 text-white text-sm font-bold rounded-xl">+ Add product</button>
        </div>
        <div id="staff-product-form" class="hidden bg-white rounded-2xl border p-4 space-y-3 max-w-2xl">
          <div class="grid sm:grid-cols-2 gap-3">
            <input id="spf-name" placeholder="Name *" class="px-3 py-2 text-sm border rounded-xl"/>
            <input id="spf-sku" placeholder="SKU *" class="px-3 py-2 text-sm border rounded-xl"/>
            <input id="spf-cost" type="number" placeholder="Cost AED *" class="px-3 py-2 text-sm border rounded-xl"/>
            <input id="spf-price" type="number" placeholder="Suggested price *" class="px-3 py-2 text-sm border rounded-xl"/>
            <input id="spf-stock" type="number" placeholder="Stock" value="0" class="px-3 py-2 text-sm border rounded-xl"/>
            <select id="spf-category" class="px-3 py-2 text-sm border rounded-xl"><option>Mobile</option><option>Beauty</option><option>Home</option><option>Sports</option><option>Car</option><option>Toys</option><option>Other</option></select>
            <input id="spf-image" type="file" accept="image/*" class="text-sm sm:col-span-2"/>
          </div>
          <button onclick="staffSaveProduct()" class="px-4 py-2 bg-brand-600 text-white text-sm font-bold rounded-xl">Save</button>
        </div>
        <div class="bg-white rounded-2xl border overflow-hidden">
          <table class="w-full text-sm"><thead><tr class="bg-slate-50 text-left text-xs text-slate-500 uppercase"><th class="px-4 py-3">Product</th><th class="px-4 py-3">SKU</th><th class="px-4 py-3">Stock</th><th class="px-4 py-3">Update stock</th></tr></thead>
          <tbody id="staff-products-body" class="divide-y"></tbody></table>
        </div>
      </div>
    </div>
  </main>
</div>


<script>
const API = "https://zamrud.borntow2.workers.dev";
const TOKEN_KEY = "zamrud_token_staff";
const USER_KEY = "zamrud_user_staff";

function token() {
  return localStorage.getItem(TOKEN_KEY) || localStorage.getItem("zamrud_token");
}

function currentUser() {
  try {
    return JSON.parse(localStorage.getItem(USER_KEY) || localStorage.getItem("zamrud_user") || "null");
  } catch (e) {
    return null;
  }
}

async function api(path, opts) {
  opts = opts || {};
  var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (token()) headers.Authorization = "Bearer " + token();
  var res = await fetch(API + path, Object.assign({}, opts, { headers: headers }));
  var data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
  localStorage.removeItem("zamrud_token");
  localStorage.removeItem("zamrud_user");
  location.href = "login.html";
}


function showTab(id) {
  document.querySelectorAll(".tab-panel").forEach(function (p) { p.classList.remove("active"); });
  document.getElementById("tab-" + id).classList.add("active");
  document.querySelectorAll(".sidebar-link").forEach(function (l) { l.classList.toggle("active", l.dataset.tab === id); });
  document.getElementById("page-title").textContent = ({ queue: "My Queue", orders: "Orders", products: "Inventory" })[id] || id;
  if (id === "orders") loadOrders();
  if (id === "queue") loadTasks();
  if (id === "products") loadStaffProducts();
}

async function loadTasks() {
  var data = await api("/tasks");
  var tasks = data.tasks || [];
  document.getElementById("stat-tasks").textContent = tasks.length;
  document.getElementById("stat-cod").textContent = tasks.filter(function (t) { return t.type === "cod"; }).length;
  document.getElementById("stat-pack").textContent = tasks.filter(function (t) { return t.type === "pack"; }).length;
  document.getElementById("tasks-list").innerHTML = tasks.map(function (t) {
    var badge = t.type === "cod" ? "bg-amber-100 text-amber-700" : "bg-blue-100 text-blue-700";
    return '<div class="px-5 py-3.5 flex items-center gap-3"><span class="text-xs font-bold px-2 py-0.5 rounded ' + badge + '">' + t.type.toUpperCase() + '</span><div class="flex-1"><div class="font-medium">' + t.order_number + " · " + t.customer_name + " · " + (t.customer_phone || "") + '</div><div class="text-xs text-slate-400">' + t.product_name + " · " + t.sell_price_aed + " AED · order: " + t.order_status + '</div></div><button onclick="doneTask(\'' + t.id + '\')" class="px-3 py-1.5 text-xs font-semibold bg-brand-600 text-white rounded-lg">Done</button></div>';
  }).join("") || '<div class="px-5 py-8 text-center text-slate-400">No open tasks</div>';
}

async function doneTask(id) {
  try {
    await api("/tasks/" + id + "/done", { method: "POST", body: "{}" });
    loadTasks();
  } catch (e) {
    alert(e.message);
  }
}

async function loadOrders() {
  var data = await api("/orders");
  document.getElementById("orders-body").innerHTML = (data.orders || []).map(function (o) {
    var actions = "";
    if (o.status === "pending") actions = '<button onclick="setStatus(\'' + o.id + '\',\'confirmed\')" class="text-xs text-brand-600 font-semibold">Confirm</button>';
    if (o.status === "confirmed") actions = '<button onclick="setStatus(\'' + o.id + '\',\'shipped\')" class="text-xs text-brand-600 font-semibold">Ship</button>';
    if (o.status === "shipped") actions = '<button onclick="setStatus(\'' + o.id + '\',\'delivered\')" class="text-xs text-green-600 font-semibold">Deliver</button>';
    return '<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium text-brand-700">' + o.order_number + '</td><td class="px-4 py-3">' + o.customer_name + '</td><td class="px-4 py-3">' + o.customer_phone + '</td><td class="px-4 py-3">' + o.product_name + '</td><td class="px-4 py-3">' + o.status + '</td><td class="px-4 py-3">' + actions + "</td></tr>";
  }).join("") || '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">No orders</td></tr>';
}

async function setStatus(id, status) {
  try {
    await api("/orders/" + id, { method: "PATCH", body: JSON.stringify({ status: status }) });
    loadOrders();
    loadTasks();
  } catch (e) {
    alert(e.message);
  }
}

async function enterApp() {
  var u = currentUser();
  if (!u || (u.role !== "staff" && u.role !== "admin")) {
    logout();
    return;
  }
  document.getElementById("user-name").textContent = u.name;
  document.getElementById("user-email").textContent = u.email;
  document.getElementById("avatar").textContent = (u.name || "S").charAt(0).toUpperCase();
  await loadTasks();
}

enterApp();

</script>

</body>
</html>
